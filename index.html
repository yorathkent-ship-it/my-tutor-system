<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智學通 - 管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 p-4">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">學生繳費與提醒系統</h1>
        
        <!-- 學生列表 -->
        <div id="studentList" class="space-y-4">
            <!-- 這裡將由 JavaScript 動態填入 -->
        </div>
    </div>

    <script>
        // 學生數據範例
        let students = [
            { id: 1, name: "陳小明", parent: "陳媽媽", phone: "60123456789", balance: 150 },
            { id: 2, name: "林小華", parent: "林爸爸", phone: "60198765432", balance: 150 }
        ];

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = students.map(s => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${s.name}</h3>
                        <p class="text-sm text-slate-500">家長：${s.parent} | 應繳：RM ${s.balance}</p>
                    </div>
                    <button onclick="sendReminder('${s.phone}', '${s.name}', ${s.balance})" 
                            class="bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-600 transition flex items-center gap-2">
                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                        一鍵提醒繳費
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function sendReminder(phone, studentName, amount) {
            // 訊息內容調整為針對學生本人
            const message = `你好 ${studentName}，這裡是智學通。提醒你本期學費已到期，應繳金額為 RM ${amount}，請記得通知家長處理，謝謝配合！`;
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        renderStudents();
    </script>
</body>
</html>
