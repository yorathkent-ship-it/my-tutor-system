<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智學通 - 學生自主查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-indigo-900">學生查詢系統</h1>
            <p class="text-xs text-slate-500">輸入學號即時查看課堂餘額</p>
        </header>

        <div class="bg-indigo-900 p-6 rounded-3xl shadow-xl text-white">
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="輸入學號 (如: STU001)" class="flex-grow px-4 py-3 bg-white/10 border border-white/20 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400">
                <button onclick="query()" class="bg-indigo-500 px-6 py-3 rounded-2xl font-bold">查詢</button>
            </div>
        </div>

        <div id="result" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-end">
                <div>
                    <h2 id="name" class="text-2xl font-black">--</h2>
                    <p id="id" class="text-xs text-slate-400 font-mono"></p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">剩餘堂數</p>
                    <span id="balance" class="text-4xl font-black text-indigo-600">0</span>
                </div>
            </div>
            <div class="bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="bar" class="bg-indigo-600 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="tip" class="text-xs text-slate-500"></p>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem("students_class_db") || "[]");
        function query() {
            const id = document.getElementById("searchInput").value.trim().toUpperCase();
            const st = students.find(s => s.id === id || s.phone === id);
            if(!st) return alert("找不到學生資料");
            
            document.getElementById("name").innerText = st.name;
            document.getElementById("id").innerText = st.id;
            document.getElementById("balance").innerText = st.balance;
            document.getElementById("result").classList.remove("hidden");
            
            const prog = ((st.balance % 4 || 4) / 4) * 100;
            document.getElementById("bar").style.width = prog + "%";
            document.getElementById("tip").innerText = st.balance <= 0 ? "⚠️ 學費已到期，請聯繫老師繳費。" : "餘額充足，祝學習愉快！";
        }
    </script>
</body>
</html>
